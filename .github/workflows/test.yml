name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x, 24.x, 26.x ]
        homebridge-version: [ 2.4.0, 2.5.0 ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Select Homebridge compatibility version
        run: npm install --no-save --package-lock=false --ignore-scripts homebridge@${{ matrix.homebridge-version }}

      - name: Run tests
        run: npm test
